<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <header>
            <h1>Find your film</h1>
            <a href='watchlist.html' class='header-img'>My watchlist</a>
        </header>
        <div id='search-bar'>
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type='text' placeholder="Search for a movie" id='user-input'>
            <i class="fa-solid fa-xmark fa-2xs"></i>
            <button id='search-btn'>Search</button>
        </div>
        <div id='result-list'></div>
        <div id='start-search'>
            <i class="fa-solid fa-film fa-4x"></i>
            <p class='screen-msg'>Start Exploring</p>
        </div>
        <script src="index.js"></script>
    </body>
</html>
